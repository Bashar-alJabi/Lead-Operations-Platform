# Private clamd INSTREAM service. Never publish this socket to an untrusted network.
Foreground yes
LogTime yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
MaxQueue 16
StreamMaxLength 100M
MaxScanSize 100M
MaxFileSize 100M
MaxRecursion 16
MaxScanTime 30000
AlertExceedsMax yes
AlertEncrypted yes
ConcurrentDatabaseReload no
